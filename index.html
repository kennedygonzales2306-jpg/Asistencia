<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ea580c">
    <title>Asistencia - Iglesia Bautista Gracia sobre Gracia</title>
    <style>
        :root {
            --primary: #ea580c;
            --primary-hover: #c2410c;
            --primary-light: rgba(254, 243, 199, 0.96);
            --text-main: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #f1f5f9;
            --border-glass: rgba(255, 255, 255, 0.4);
            --success: #10b981;
            --success-bg: rgba(209, 250, 229, 0.95);
            --success-text: #065f46;
            --error: #ef4444;
            --error-bg: rgba(254, 226, 226, 0.95);
            --error-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-color: #0f172a;
            background-image: linear-gradient(rgba(15, 23, 42, 0.22), rgba(15, 23, 42, 0.48)), url('fondo.jpeg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        .app-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: transparent;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 1024px) {
            .app-container {
                max-width: 600px;
                margin: 0 auto;
                border-left: 1px solid rgba(255, 255, 255, 0.25);
                border-right: 1px solid rgba(255, 255, 255, 0.25);
            }
        }

        .church-header-banner {
            background-color: rgba(234, 88, 12, 0.95);
            color: #ffffff;
            padding: 0.65rem 1rem;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        }

        .top-bar {
            background-color: rgba(15, 23, 42, 0.48);
            padding: 0.95rem 1rem 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.85rem;
            gap: 0.5rem;
        }

        .title-row h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 850;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
        }

        .title-row .date-subtitle {
            font-size: 0.84rem;
            color: var(--text-muted);
            display: block;
            margin-top: 0.15rem;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .header-actions {
            display: flex;
            gap: 0.45rem;
            flex-shrink: 0;
        }

        .btn-secondary-header {
            background-color: rgba(15, 23, 42, 0.55);
            color: #ffffff;
            border: 1.5px solid var(--border-glass);
            border-radius: 12px;
            padding: 0.65rem 0.85rem;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-secondary-header:active {
            background-color: rgba(255, 255, 255, 0.28);
        }

        .btn-add-person {
            background-color: var(--primary);
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            padding: 0.65rem 0.95rem;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.45);
        }

        .btn-add-person:active {
            transform: scale(0.97);
        }

        .salones-tabs {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: none;
        }
        .salones-tabs::-webkit-scrollbar { display: none; }

        .salon-tab {
            flex: 1 0 auto;
            min-width: 92px;
            padding: 0.7rem 0.9rem;
            border: 1.5px solid var(--border-glass);
            background: rgba(15, 23, 42, 0.48);
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .salon-tab.active {
            background-color: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary-hover);
            font-weight: 850;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
        }

        .salon-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.35rem;
            margin-bottom: 0.55rem;
            padding: 0.65rem 0.85rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 12px;
        }

        .encargado-box {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            min-width: 0;
            flex: 1;
        }

        .encargado-text {
            font-size: 0.86rem;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .encargado-text strong {
            color: #ffffff;
            font-weight: 800;
        }

        .btn-edit-encargado {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            border-radius: 8px;
            padding: 0.25rem 0.45rem;
            font-size: 0.78rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-ofrenda-salon {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            padding: 0.5rem 0.75rem;
            font-size: 0.84rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            box-shadow: 0 3px 10px rgba(16, 185, 129, 0.35);
            flex-shrink: 0;
        }

        .btn-ofrenda-salon:active {
            transform: scale(0.97);
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.9rem 2.6rem 0.9rem 2.75rem;
            border: 1.5px solid var(--border-glass);
            border-radius: 14px;
            font-size: 1rem;
            color: #ffffff;
            font-weight: 600;
            background-color: rgba(15, 23, 42, 0.52);
            transition: all 0.2s;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        .search-box input:focus {
            outline: none;
            border-color: #ffffff;
            background-color: rgba(15, 23, 42, 0.75);
        }

        .search-icon {
            position: absolute;
            left: 0.95rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .clear-search {
            position: absolute;
            right: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.35);
            color: white;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 0.85rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 1rem;
            background-color: rgba(15, 23, 42, 0.52);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .stats-bar strong {
            font-weight: 800;
            color: #ffffff;
        }

        .person-list {
            flex: 1;
            padding: 0.9rem 1rem 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .person-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.1rem 1rem;
            background: rgba(15, 23, 42, 0.54);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.38);
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
            transition: all 0.15s ease;
            gap: 0.6rem;
        }

        .person-card:active {
            transform: scale(0.985);
            background-color: rgba(15, 23, 42, 0.74);
        }

        .person-card.registered {
            border-color: #34d399;
            background: rgba(6, 95, 70, 0.7);
        }

        .person-info {
            min-width: 0;
            flex: 1;
        }

        .person-info h3 {
            margin: 0 0 0.28rem;
            font-size: 1.12rem;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .person-info p {
            margin: 0;
            font-size: 0.85rem;
            font-weight: 500;
            color: #e2e8f0;
            line-height: 1.35;
        }

        .obs-pill {
            display: inline-block;
            margin-top: 0.3rem;
            padding: 0.18rem 0.55rem;
            background: rgba(254, 243, 199, 0.22);
            border: 1px solid rgba(254, 243, 199, 0.5);
            color: #fef3c7;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .badge {
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        .badge.pending {
            background-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .badge.done {
            background-color: var(--success);
            color: #ffffff;
        }

        .empty-state {
            text-align: center;
            padding: 2.2rem 1rem;
            color: #ffffff;
            background: rgba(15, 23, 42, 0.58);
            border: 1.5px solid var(--border-glass);
            border-radius: 16px;
            backdrop-filter: blur(8px);
        }

        .empty-state button {
            margin-top: 0.85rem;
            background-color: var(--primary);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.85rem 1.3rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.75);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 50;
            backdrop-filter: blur(4px);
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-sheet {
            background: #ffffff;
            color: var(--text-dark);
            width: 100%;
            max-width: 600px;
            border-radius: 24px 24px 0 0;
            padding: 1.4rem 1.2rem 1.8rem;
            max-height: 92vh;
            overflow-y: auto;
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .modal-header span {
            font-size: 0.85rem;
            color: var(--primary-hover);
            font-weight: 750;
            display: block;
            margin-bottom: 0.15rem;
        }

        .btn-close {
            background: #f1f5f9;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            color: #64748b;
            cursor: pointer;
            flex-shrink: 0;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        .form-group label.section-label {
            display: block;
            margin-bottom: 0.45rem;
            font-weight: 700;
            font-size: 0.94rem;
            color: var(--text-dark);
        }

        .form-control {
            width: 100%;
            padding: 0.9rem 0.95rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            background-color: #f8fafc;
            color: var(--text-dark);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
        }

        .quick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.55rem;
        }

        .tag-chip {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #334155;
            border-radius: 999px;
            padding: 0.35rem 0.7rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .tag-chip:active {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary-hover);
        }

        .radio-group {
            display: grid;
            gap: 0.5rem;
        }
        .cols-3 { grid-template-columns: repeat(3, 1fr); }
        .cols-2 { grid-template-columns: repeat(2, 1fr); }

        .radio-option input { display: none; }
        .radio-option label {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.9rem 0.4rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            background: #f8fafc;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }

        .radio-option input:checked + label {
            background-color: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary-hover);
            font-weight: 800;
        }

        .btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 1rem;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            min-height: 52px;
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .salon-manage-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin-bottom: 1.25rem;
        }

        .salon-manage-card {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }

        .salon-manage-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .salon-manage-card input {
            flex: 1;
            padding: 0.7rem 0.8rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.92rem;
            background-color: #ffffff;
            color: var(--text-dark);
        }

        .btn-icon-save {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: none;
            border-radius: 10px;
            padding: 0.7rem 0.9rem;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-icon-delete {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: none;
            border-radius: 10px;
            padding: 0.7rem 0.8rem;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .add-salon-box {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
        }

        .add-salon-box input {
            width: 100%;
            padding: 0.8rem 0.9rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: white;
            padding: 0.9rem 1.25rem;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
            transition: transform 0.25s ease;
            z-index: 100;
            text-align: center;
            width: 90%;
            max-width: 420px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { background: #065f46; }
        .toast.error { background: #991b1b; }
    </style>
</head>
<body>

<div class="bg-layer"></div>

<div class="app-container">
    <div class="church-header-banner">
        Iglesia Bautista Gracia sobre Gracia • Callao
    </div>

    <div class="top-bar">
        <div class="title-row">
            <div>
                <h1>Control de Asistencia</h1>
                <span class="date-subtitle" id="currentDateLabel">Martes, 17 de noviembre de 2026</span>
            </div>
            <div class="header-actions">
                <button type="button" class="btn-secondary-header" onclick="abrirModalSalones()">
                    ⚙️ Salones
                </button>
                <button type="button" class="btn-add-person" onclick="abrirModalNuevaPersona()">
                    + Persona
                </button>
            </div>
        </div>

        <!-- Botones de salones pre-cargados en HTML para visualización inmediata -->
        <div class="salones-tabs" id="salonesTabs">
            <button type="button" class="salon-tab active" onclick="seleccionarSalon('sal_1')">Salón 1</button>
            <button type="button" class="salon-tab" onclick="seleccionarSalon('sal_2')">Salón 2</button>
            <button type="button" class="salon-tab" onclick="seleccionarSalon('sal_3')">Salón 3</button>
            <button type="button" class="salon-tab" onclick="seleccionarSalon('sal_4')">Salón 4</button>
            <button type="button" class="salon-tab" onclick="seleccionarSalon('sal_5')">Salón 5</button>
        </div>

        <div class="salon-info-bar">
            <div class="encargado-box">
                <span class="encargado-text">
                    👤 Encargado: <strong id="encargadoSalonTexto">Por asignar</strong>
                </span>
                <button type="button" class="btn-edit-encargado" title="Cambiar encargado" onclick="editarEncargadoRapido()">
                    ✏️
                </button>
            </div>
            <button type="button" class="btn-ofrenda-salon" onclick="abrirModalOfrendaSalon()">
                💰 Ofrenda: <span id="ofrendaSalonTexto">S/ 0.00</span>
            </button>
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Buscar nombre en Salón 1..." oninput="filtrarPersonas()">
            <button type="button" class="clear-search" id="clearSearchBtn" onclick="limpiarBusqueda()">✕</button>
        </div>
    </div>

    <div class="stats-bar">
        <span>Salón: <strong id="salonActualTexto">Salón 1</strong></span>
        <span>Asistencia hoy: <strong id="contadorRegistrados">0 / 3</strong></span>
    </div>

    <div class="person-list" id="personList"></div>
</div>

<!-- MODAL 1: Registrar Asistencia Individual -->
<div class="modal-backdrop" id="modalAsistencia" onclick="cerrarModalFondo(event, 'modalAsistencia')">
    <div class="modal-sheet">
        <div class="modal-header">
            <div>
                <span id="modalSalonTag">Salón 1</span>
                <h2 id="modalNombrePersona">Nombre de Persona</h2>
            </div>
            <button type="button" class="btn-close" onclick="cerrarModal('modalAsistencia')">✕</button>
        </div>

        <form id="formAsistencia" onsubmit="guardarAsistencia(event)">
            <div class="form-group">
                <label class="section-label">Asistencia</label>
                <div class="radio-group cols-3">
                    <div class="radio-option">
                        <input type="radio" name="asistencia" id="a_presente" value="Presente" checked onchange="sincronizarPuntualidad('Presente')">
                        <label for="a_presente">Presente</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="asistencia" id="a_tardanza" value="Tardanza" onchange="sincronizarPuntualidad('Tardanza')">
                        <label for="a_tardanza">Tardanza</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="asistencia" id="a_ausente" value="Ausente">
                        <label for="a_ausente">Ausente</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="section-label">Puntualidad</label>
                <div class="radio-group cols-2">
                    <div class="radio-option">
