<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Asistencia por Salones</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #10b981;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 540px;
            background-color: var(--card-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(0,0,0,0.05);
        }

        /* Cabecera fija */
        .top-bar {
            background-color: var(--card-bg);
            padding: 1rem 1.25rem 0.75rem;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.85rem;
            gap: 0.5rem;
        }

        .title-row h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .title-row span {
            font-size: 0.78rem;
            color: var(--text-muted);
            display: block;
        }

        .header-actions {
            display: flex;
            gap: 0.45rem;
            flex-shrink: 0;
        }

        .btn-secondary-header {
            background-color: #f1f5f9;
            color: var(--text-main);
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 0.55rem 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-secondary-header:active {
            background-color: #e2e8f0;
        }

        .btn-add-person {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.55rem 0.85rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
        }

        .btn-add-person:active {
            transform: scale(0.97);
        }

        /* Selector dinámico de Salones */
        .salones-tabs {
            display: flex;
            gap: 0.45rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: none;
        }
        .salones-tabs::-webkit-scrollbar { display: none; }

        .salon-tab {
            flex: 0 0 auto;
            min-width: 86px;
            padding: 0.65rem 0.85rem;
            border: 1.5px solid var(--border-color);
            background: #f8fafc;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .salon-tab.active {
            background-color: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Buscador */
        .search-box {
            position: relative;
            margin-top: 0.45rem;
        }

        .search-box input {
            width: 100%;
            padding: 0.85rem 2.5rem 0.85rem 2.6rem;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            background-color: #f8fafc;
            transition: all 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .clear-search {
            position: absolute;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            background: #cbd5e1;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.8rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        /* Resumen rápido del salón */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            padding: 0.65rem 1.25rem;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stats-bar strong {
            color: var(--text-main);
        }

        /* Lista de asistentes */
        .person-list {
            flex: 1;
            padding: 0.75rem 1.25rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .person-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .person-card:active {
            transform: scale(0.985);
            background-color: #f8fafc;
        }

        .person-card.registered {
            border-color: #a7f3d0;
            background-color: #f0fdf4;
        }

        .person-info h3 {
            margin: 0 0 0.25rem;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .person-info p {
            margin: 0;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .badge {
            padding: 0.4rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .badge.pending {
            background-color: #f1f5f9;
            color: var(--primary);
        }

        .badge.done {
            background-color: var(--success-bg);
            color: var(--success-text);
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
        }

        .empty-state button {
            margin-top: 0.75rem;
            background-color: var(--primary-light);
            color: var(--primary);
            border: 1.5px solid var(--primary);
            padding: 0.7rem 1.2rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Modales */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 50;
            backdrop-filter: blur(2px);
        }

        @media (min-width: 540px) {
            .modal-backdrop {
                align-items: center;
                padding: 1rem;
            }
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-sheet {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 22px 22px 0 0;
            padding: 1.5rem;
            max-height: 92vh;
            overflow-y: auto;
            animation: slideUp 0.22s ease-out;
        }

        @media (min-width: 540px) {
            .modal-sheet {
                border-radius: 20px;
            }
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .modal-header span {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
        }

        .btn-close {
            background: #f1f5f9;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
            flex-shrink: 0;
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        .form-group label.section-label {
            display: block;
            margin-bottom: 0.45rem;
            font-weight: 600;
            font-size: 0.92rem;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            background-color: #f8fafc;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
        }

        .radio-group {
            display: grid;
            gap: 0.5rem;
        }
        .cols-3 { grid-template-columns: repeat(3, 1fr); }
        .cols-2 { grid-template-columns: repeat(2, 1fr); }

        .radio-option input { display: none; }
        .radio-option label {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.8rem 0.4rem;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            background: #f8fafc;
            font-weight: 500;
            font-size: 0.92rem;
            cursor: pointer;
            text-align: center;
        }

        .radio-option input:checked + label {
            background-color: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 700;
        }

        .btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50px;
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* Estilos del Gestor de Salones */
        .salon-manage-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1.25rem;
        }

        .salon-manage-item {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .salon-manage-item input {
            flex: 1;
            padding: 0.7rem 0.85rem;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: #f8fafc;
        }

        .salon-manage-item input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
        }

        .btn-icon-save {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: none;
            border-radius: 10px;
            padding: 0.7rem 0.85rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-icon-delete {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: none;
            border-radius: 10px;
            padding: 0.7rem 0.75rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .add-salon-row {
            display: flex;
            gap: 0.5rem;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
        }

        .add-salon-row input {
            flex: 1;
            padding: 0.8rem 0.9rem;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .add-salon-row button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 1.1rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Notificación flotante (Toast) */
        .toast {
            position: fixed;
            bottom: 1.25rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: white;
            padding: 0.85rem 1.25rem;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.25s ease;
            z-index: 100;
            text-align: center;
            max-width: 90%;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { background: #065f46; }
        .toast.error { background: #991b1b; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Cabecera y Filtros -->
    <div class="top-bar">
        <div class="title-row">
            <div>
                <h1>Control de Asistencia</h1>
                <span id="currentDateLabel">Cargando fecha...</span>
            </div>
            <div class="header-actions">
                <button type="button" class="btn-secondary-header" onclick="abrirModalSalones()">
                    ⚙️ Salones
                </button>
                <button type="button" class="btn-add-person" onclick="abrirModalNuevaPersona()">
                    + Persona
                </button>
            </div>
        </div>

        <!-- Pestañas dinámicas de Salones -->
        <div class="salones-tabs" id="salonesTabs"></div>

        <!-- Buscador -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Buscar nombre..." oninput="filtrarPersonas()">
            <button type="button" class="clear-search" id="clearSearchBtn" onclick="limpiarBusqueda()">✕</button>
        </div>
    </div>

    <!-- Barra de progreso del salón -->
    <div class="stats-bar">
        <span>Mostrando: <strong id="salonActualTexto">Salón 1</strong></span>
        <span>Registrados hoy: <strong id="contadorRegistrados">0 / 0</strong></span>
    </div>

    <!-- Lista de Resultados -->
    <div class="person-list" id="personList"></div>
</div>

<!-- MODAL 1: Registrar Asistencia de la persona seleccionada -->
<div class="modal-backdrop" id="modalAsistencia" onclick="cerrarModalFondo(event, 'modalAsistencia')">
    <div class="modal-sheet">
        <div class="modal-header">
            <div>
                <span id="modalSalonTag">Salón 1</span>
                <h2 id="modalNombrePersona">Nombre de Persona</h2>
            </div>
            <button type="button" class="btn-close" onclick="cerrarModal('modalAsistencia')">✕</button>
        </div>

        <form id="formAsistencia" onsubmit="guardarAsistencia(event)">
            <div class="form-group">
                <label class="section-label">Asistencia</label>
                <div class="radio-group cols-3">
                    <div class="radio-option">
                        <input type="radio" name="asistencia" id="a_presente" value="Presente" checked>
                        <label for="a_presente">Presente</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="asistencia" id="a_tardanza" value="Tardanza">
                        <label for="a_tardanza">Tardanza</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="asistencia" id="a_ausente" value="Ausente">
                        <label for="a_ausente">Ausente</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="section-label">Puntualidad</label>
                <div class="radio-group cols-2">
                    <div class="radio-option">
                        <input type="radio" name="puntualidad" id="p_atiempo" value="A tiempo" checked>
                        <label for="p_atiempo">A tiempo</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="puntualidad" id="p_tarde" value="Tarde">
                        <label for="p_tarde">Tarde</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="section-label">¿Trajo su Biblia?</label>
                <div class="radio-group cols-2">
                    <div class="radio-option">
                        <input type="radio" name="biblias" id="b_si" value="Sí" checked>
                        <label for="b_si">Sí</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="biblias" id="b_no" value="No">
                        <label for="b_no">No</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="section-label" for="ofrendasInput">Ofrendas (S/ - Opcional)</label>
                <input type="number" id="ofrendasInput" class="form-control" placeholder="0.00" step="0.10" min="0" inputmode="decimal">
            </div>

            <button type="submit" class="btn-primary" id="btnGuardarAsistencia">
                Confirmar Registro
            </button>
        </form>
    </div>
</div>

<!-- MODAL 2: Añadir Nueva Persona -->
<div class="modal-backdrop" id="modalNuevaPersona" onclick="cerrarModalFondo(event, 'modalNuevaPersona')">
    <div class="modal-sheet">
        <div class="modal-header">
            <div>
                <span>Directorio de Iglesia</span>
                <h2>Añadir Nueva Persona</h2>
            </div>
            <button type="button" class="btn-close" onclick="cerrarModal('modalNuevaPersona')">✕</button>
        </div>

        <form id="formNuevaPersona" onsubmit="agregarNuevaPersona(event)">
            <div class="form-group">
                <label class="section-label" for="nuevoNombre">Nombres y Apellidos</label>
                <input type="text" id="nuevoNombre" class="form-control" required placeholder="Ej. María Fernanda López" autocomplete="off">
            </div>

            <div class="form-group">
                <label class="section-label" for="nuevoSalon">Asignar a Salón</label>
                <select id="nuevoSalon" class="form-control" required></select>
            </div>

            <div class="form-group">
                <label style="display:flex; align-items:center; gap:0.6rem; cursor:pointer; font-size:0.95rem;">
                    <input type="checkbox" id="abrirRegistroAlCrear" checked style="width:18px; height:18px;">
                    Marcar su asistencia inmediatamente después de añadir
                </label>
            </div>

            <button type="submit" class="btn-primary" id="btnGuardarPersona">
                Guardar en Lista
            </button>
        </form>
    </div>
</div>

<!-- MODAL 3: Gestionar Salones (Renombrar / Añadir / Eliminar) -->
<div class="modal-backdrop" id="modalSalones" onclick="cerrarModalFondo(event, 'modalSalones')">
    <div class="modal-sheet">
        <div class="modal-header">
            <div>
                <span>Configuración</span>
                <h2>Gestionar Salones</h2>
            </div>
            <button type="button" class="btn-close" onclick="cerrarModal('modalSalones')">✕</button>
        </div>

        <p style="margin-top:0; font-size:0.85rem; color:var(--text-muted);">
            Edita el nombre de un salón y pulsa <strong>Guardar</strong>, o añade nuevos salones abajo.
        </p>

        <div class="salon-manage-list" id="salonManageList"></div>

        <form class="add-salon-row" onsubmit="crearNuevoSalon(event)">
            <input type="text" id="inputNuevoSalonNombre" placeholder="Nombre del nuevo salón..." required autocomplete="off">
            <button type="submit">+ Añadir</button>
        </form>
    </div>
</div>

<!-- Notificación Toast -->
<div id="toast" class="toast"></div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwlxZd0DEj38M6bvx-X2Y4ow7rEx5CW_zvQgLaPanzEqHR_fBGIBY4aMAoyVo2KrhrB/exec';

    // Cargar salones guardados o usar los 5 por defecto
    let listaSalones = JSON.parse(localStorage.getItem('iglesia_salones')) || [
        { id: 'sal_1', nombre: 'Salón 1' },
        { id: 'sal_2', nombre: 'Salón 2' },
        { id: 'sal_3', nombre: 'Salón 3' },
        { id: 'sal_4', nombre: 'Salón 4' },
        { id: 'sal_5', nombre: 'Salón 5' }
    ];

    // Base de datos inicial vinculada por ID de salón (así al renombrar no se pierde nadie)
    let directorioPersonas = JSON.parse(localStorage.getItem('iglesia_personas')) || [
        { id: 1, nombre: 'Carlos Mendoza Ruiz', salonId: 'sal_1', registradoHoy: false, detalle: '' },
        { id: 2, nombre: 'Ana Sofía Torres', salonId: 'sal_1', registradoHoy: false, detalle: '' },
        { id: 3, nombre: 'Luis Alberto Quispe', salonId: 'sal_1', registradoHoy: false, detalle: '' },
        { id: 4, nombre: 'Valeria Gómez Díaz', salonId: 'sal_2', registradoHoy: false, detalle: '' },
        { id: 5, nombre: 'Jorge Luis Castillo', salonId: 'sal_2', registradoHoy: false, detalle: '' },
        { id: 6, nombre: 'Rosa Elena Paredes', salonId: 'sal_3', registradoHoy: false, detalle: '' },
        { id: 7, nombre: 'Mateo Sebastián Rojas', salonId: 'sal_4', registradoHoy: false, detalle: '' },
        { id: 8, nombre: 'Camila Andrea Vargas', salonId: 'sal_5', registradoHoy: false, detalle: '' }
    ];

    let salonActivoId = listaSalones[0].id;
    let personaActiva = null;

    function guardarEstadoLocal() {
        localStorage.setItem('iglesia_salones', JSON.stringify(listaSalones));
        localStorage.setItem('iglesia_personas', JSON.stringify(directorioPersonas));
    }

    function obtenerNombreSalon(salonId) {
        const s = listaSalones.find(item => item.id === salonId);
        return s ? s.nombre : 'Sin salón';
    }

    // Inicializar fecha, pestañas y lista
    document.addEventListener('DOMContentLoaded', () => {
        const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const hoy = new Date().toLocaleDateString('es-PE', opcionesFecha);
        document.getElementById('currentDateLabel').innerText = hoy.charAt(0).toUpperCase() + hoy.slice(1);
        
        renderizarTabsSalones();
        renderizarLista();
    });

    function renderizarTabsSalones() {
        const contenedor = document.getElementById('salonesTabs');
        contenedor.innerHTML = '';

        // Verificar que el salón activo siga existiendo
        if (!listaSalones.some(s => s.id === salonActivoId) && listaSalones.length > 0) {
            salonActivoId = listaSalones[0].id;
        }

        listaSalones.forEach(salon => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `salon-tab ${salon.id === salonActivoId ? 'active' : ''}`;
            btn.innerText = salon.nombre;
            btn.onclick = () => seleccionarSalon(salon.id);
            contenedor.appendChild(btn);
        });

        const nombreActivo = obtenerNombreSalon(salonActivoId);
        document.getElementById('salonActualTexto').innerText = nombreActivo;
        document.getElementById('searchInput').placeholder = `Buscar nombre en ${nombreActivo}...`;
    }

    function seleccionarSalon(salonId) {
        salonActivoId = salonId;
        renderizarTabsSalones();
        renderizarLista();
    }

    function filtrarPersonas() {
        const texto = document.getElementById('searchInput').value;
        document.getElementById('clearSearchBtn').style.display = texto.length > 0 ? 'flex' : 'none';
        renderizarLista();
    }

    function limpiarBusqueda() {
        const input = document.getElementById('searchInput');
        input.value = '';
        document.getElementById('clearSearchBtn').style.display = 'none';
        input.focus();
        renderizarLista();
    }

    function renderizarLista() {
        const contenedor = document.getElementById('personList');
        const filtro = document.getElementById('searchInput').value.toLowerCase().trim();
        const nombreSalonActual = obtenerNombreSalon(salonActivoId);

        const personasDelSalon = directorioPersonas.filter(p => p.salonId === salonActivoId);
        const registradosCount = personasDelSalon.filter(p => p.registradoHoy).length;
        document.getElementById('contadorRegistrados').innerText = `${registradosCount} / ${personasDelSalon.length}`;

        const filtradas = personasDelSalon.filter(p => p.nombre.toLowerCase().includes(filtro));

        contenedor.innerHTML = '';

        if (filtradas.length === 0) {
            const mensaje = filtro 
                ? `No se encontró a <strong>"${document.getElementById('searchInput').value}"</strong> en ${nombreSalonActual}.`
                : `Aún no hay personas registradas en <strong>${nombreSalonActual}</strong>.`;

            contenedor.innerHTML = `
                <div class="empty-state">
                    <p>${mensaje}</p>
                    <button type="button" onclick="abrirModalConNombre()">+ Añadir persona a ${nombreSalonActual}</button>
                </div>
            `;
            return;
        }

        filtradas.forEach(persona => {
            const card = document.createElement('div');
            card.className = `person-card ${persona.registradoHoy ? 'registered' : ''}`;
            card.onclick = () => abrirModalAsistencia(persona);

            card.innerHTML = `
                <div class="person-info">
                    <h3>${persona.nombre}</h3>
                    <p>${persona.registradoHoy ? persona.detalle : 'Toca para registrar asistencia'}</p>
                </div>
                <span class="badge ${persona.registradoHoy ? 'done' : 'pending'}">
                    ${persona.registradoHoy ? '✓ Registrado' : 'Registrar'}
                </span>
            `;
            contenedor.appendChild(card);
        });
    }

    // --- Gestión de Salones (Renombrar / Añadir / Eliminar) ---
    function abrirModalSalones() {
        renderizarListaGestionSalones();
        document.getElementById('modalSalones').classList.add('open');
    }

    function renderizarListaGestionSalones() {
        const contenedor = document.getElementById('salonManageList');
        contenedor.innerHTML = '';

        listaSalones.forEach(salon => {
            const cantidadPersonas = directorioPersonas.filter(p => p.salonId === salon.id).length;
            const row = document.createElement('div');
            row.className = 'salon-manage-item';

            row.innerHTML = `
                <input type="text" id="edit_salon_${salon.id}" value="${salon.nombre}" placeholder="Nombre del salón">
                <button type="button" class="btn-icon-save" onclick="renombrarSalon('${salon.id}')">Guardar</button>
                ${listaSalones.length > 1 ? `<button type="button" class="btn-icon-delete" title="Eliminar salón" onclick="eliminarSalon('${salon.id}', ${cantidadPersonas})">✕</button>` : ''}
            `;
            contenedor.appendChild(row);
        });
    }

    function renombrarSalon(salonId) {
        const input = document.getElementById(`edit_salon_${salonId}`);
        const nuevoNombre = input.value.trim();

        if (!nuevoNombre) {
            mostrarToast('El nombre del salón no puede estar vacío', 'error');
            return;
        }

        const salon = listaSalones.find(s => s.id === salonId);
        if (salon) {
            salon.nombre = nuevoNombre;
            guardarEstadoLocal();
            renderizarTabsSalones();
            renderizarLista();
            mostrarToast(`✓ Salón actualizado a "${nuevoNombre}"`, 'success');
        }
    }

    function crearNuevoSalon(e) {
        e.preventDefault();
        const input = document.getElementById('inputNuevoSalonNombre');
        const nombre = input.value.trim();
        if (!nombre) return;

        const nuevoId = 'sal_' + Date.now();
        listaSalones.push({ id: nuevoId, nombre: nombre });
        guardarEstadoLocal();

        input.value = '';
        salonActivoId = nuevoId;
        renderizarListaGestionSalones();
        renderizarTabsSalones();
        renderizarLista();
        mostrarToast(`+ Salón "${nombre}" creado`, 'success');
    }

    function eliminarSalon(salonId, cantidadPersonas) {
        if (cantidadPersonas > 0) {
            mostrarToast(`No puedes eliminar un salón con ${cantidadPersonas} persona(s) inscrita(s)`, 'error');
            return;
        }

        listaSalones = listaSalones.filter(s => s.id !== salonId);
        guardarEstadoLocal();
        renderizarListaGestionSalones();
        renderizarTabsSalones();
        renderizarLista();
        mostrarToast('Salón eliminado', 'success');
    }

    // --- Modales de Asistencia y Nueva Persona ---
    function abrirModalAsistencia(persona) {
        personaActiva = persona;
        document.getElementById('modalSalonTag').innerText = obtenerNombreSalon(persona.salonId);
        document.getElementById('modalNombrePersona').innerText = persona.nombre;
        document.getElementById('formAsistencia').reset();
        document.getElementById('modalAsistencia').classList.add('open');
    }

    function poblarSelectSalones() {
        const select = document.getElementById('nuevoSalon');
        select.innerHTML = '';
        listaSalones.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.innerText = s.nombre;
            select.appendChild(opt);
        });
        select.value = salonActivoId;
    }

    function abrirModalNuevaPersona() {
        document.getElementById('formNuevaPersona').reset();
        poblarSelectSalones();
        document.getElementById('modalNuevaPersona').classList.add('open');
        setTimeout(() => document.getElementById('nuevoNombre').focus(), 100);
    }

    function abrirModalConNombre() {
        const nombreBuscado = document.getElementById('searchInput').value.trim();
        abrirModalNuevaPersona();
        document.getElementById('nuevoNombre').value = nombreBuscado;
    }

    function cerrarModal(id) {
        document.getElementById(id).classList.remove('open');
    }

    function cerrarModalFondo(e, id) {
        if (e.target.id === id) cerrarModal(id);
    }

    // --- Acciones de Formulario ---
    function guardarAsistencia(e) {
        e.preventDefault();
        if (!personaActiva) return;

        const asistencia = document.querySelector('input[name="asistencia"]:checked').value;
        const puntualidad = document.querySelector('input[name="puntualidad"]:checked').value;
        const biblias = document.querySelector('input[name="biblias"]:checked').value;
        const ofrendas = Number(document.getElementById('ofrendasInput').value) || 0;

        personaActiva.registradoHoy = true;
        personaActiva.detalle = `${asistencia} • ${puntualidad} • Biblia: ${biblias}${ofrendas > 0 ? ' • S/ ' + ofrendas.toFixed(2) : ''}`;
        guardarEstadoLocal();

        cerrarModal('modalAsistencia');
        renderizarLista();
        mostrarToast(`✓ Asistencia de ${personaActiva.nombre} registrada`, 'success');
    }

    function agregarNuevaPersona(e) {
        e.preventDefault();
        const nombre = document.getElementById('nuevoNombre').value.trim();
        const salonId = document.getElementById('nuevoSalon').value;
        const abrirRegistro = document.getElementById('abrirRegistroAlCrear').checked;

        if (!nombre) return;

        const nuevaPersona = {
            id: Date.now(),
            nombre: nombre,
            salonId: salonId,
            registradoHoy: false,
            detalle: ''
        };

        directorioPersonas.unshift(nuevaPersona);
        guardarEstadoLocal();

        cerrarModal('modalNuevaPersona');
        limpiarBusqueda();

        if (salonId !== salonActivoId) {
            seleccionarSalon(salonId);
        } else {
            renderizarLista();
        }

        mostrarToast(`+ ${nombre} añadido a ${obtenerNombreSalon(salonId)}`, 'success');

        if (abrirRegistro) {
            setTimeout(() => abrirModalAsistencia(nuevaPersona), 350);
        }
    }

    function mostrarToast(mensaje, tipo = 'success') {
        const toast = document.getElementById('toast');
        toast.innerText = mensaje;
        toast.className = `toast show ${tipo}`;
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3200);
    }
</script>

</body>
</html>
