<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ea580c">
    <title>Asistencia - Iglesia Bautista Gracia sobre Gracia</title>
    <style>
        :root {
            --primary: #ea580c;
            --primary-hover: #c2410c;
            --primary-light: rgba(254, 243, 199, 0.96);
            --text-main: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #f1f5f9;
            --border-glass: rgba(255, 255, 255, 0.4);
            --success: #10b981;
            --success-bg: rgba(209, 250, 229, 0.95);
            --success-text: #065f46;
            --error: #ef4444;
            --error-bg: rgba(254, 226, 226, 0.95);
            --error-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: var(--text-main);
            overflow-x: hidden;
            background-color: #0f172a;
        }

        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-color: #0f172a;
            background-image: linear-gradient(rgba(15, 23, 42, 0.22), rgba(15, 23, 42, 0.48)), url('fondo.jpeg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        .app-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: transparent;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 1024px) {
            .app-container {
                max-width: 600px;
                margin: 0 auto;
                border-left: 1px solid rgba(255, 255, 255, 0.25);
                border-right: 1px solid rgba(255, 255, 255, 0.25);
            }
        }

        .church-header-banner {
            background-color: rgba(234, 88, 12, 0.95);
            color: #ffffff;
            padding: 0.65rem 1rem;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        }

        .top-bar {
            background-color: rgba(15, 23, 42, 0.48);
            padding: 0.95rem 1rem 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.85rem;
            gap: 0.5rem;
        }

        .title-row h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 850;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
        }

        .title-row .date-subtitle {
            font-size: 0.84rem;
            color: var(--text-muted);
            display: block;
            margin-top: 0.15rem;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .header-actions {
            display: flex;
            gap: 0.45rem;
            flex-shrink: 0;
        }

        .btn-secondary-header {
            background-color: rgba(15, 23, 42, 0.55);
            color: #ffffff;
            border: 1.5px solid var(--border-glass);
            border-radius: 12px;
            padding: 0.65rem 0.85rem;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-add-person {
            background-color: var(--primary);
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            padding: 0.65rem 0.95rem;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.45);
        }

        .salones-tabs {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: none;
        }
        .salones-tabs::-webkit-scrollbar { display: none; }

        .salon-tab {
            flex: 1 0 auto;
            min-width: 92px;
            padding: 0.7rem 0.9rem;
            border: 1.5px solid var(--border-glass);
            background: rgba(15, 23, 42, 0.48);
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .salon-tab.active {
            background-color: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary-hover);
            font-weight: 850;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
        }

        .salon-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.35rem;
            margin-bottom: 0.55rem;
            padding: 0.65rem 0.85rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 12px;
        }

        .encargado-box {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            min-width: 0;
            flex: 1;
        }

        .encargado-text {
            font-size: 0.86rem;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .encargado-text strong {
            color: #ffffff;
            font-weight: 800;
        }

        .btn-edit-encargado {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            border-radius: 8px;
            padding: 0.25rem 0.45rem;
            font-size: 0.78rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-ofrenda-salon {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            padding: 0.5rem 0.75rem;
            font-size: 0.84rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            box-shadow: 0 3px 10px rgba(16, 185, 129, 0.35);
            flex-shrink: 0;
        }

        .search-box { position: relative; }

        .search-box input {
            width: 100%;
            padding: 0.9rem 2.6rem 0.9rem 2.75rem;
            border: 1.5px solid var(--border-glass);
            border-radius: 14px;
            font-size: 1rem;
            color: #ffffff;
            font-weight: 600;
            background-color: rgba(15, 23, 42, 0.52);
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        .search-icon {
            position: absolute;
            left: 0.95rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .clear-search {
            position: absolute;
            right: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.35);
            color: white;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 0.85rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 1rem;
            background-color: rgba(15, 23, 42, 0.52);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .stats-bar strong { font-weight: 800; color: #ffffff; }

        .person-list {
            flex: 1;
            padding: 0.9rem 1rem 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .person-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.1rem 1rem;
            background: rgba(15, 23, 42, 0.54);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.38);
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
            gap: 0.6rem;
        }

        .person-card.registered {
            border-color: #34d399;
            background: rgba(6, 95, 70, 0.7);
        }

        .person-info { min-width: 0; flex: 1; }

        .person-info h3 {
            margin: 0 0 0.28rem;
            font-size: 1.12rem;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .person-info p {
            margin: 0;
            font-size: 0.85rem;
            font-weight: 500;
            color: #e2e8f0;
            line-height: 1.35;
        }

        .obs-pill {
            display: inline-block;
            margin-top: 0.3rem;
            padding: 0.18rem 0.55rem;
